[package]
name = "dataomni"
version = "0.1.0"
description = "DataOmni is a Data Management Platform"
authors = ["yuxuetr"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dataomni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite", "mysql", "postgres"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "postgres", "sqlite", "json", "time", "chrono", "bigdecimal"] }
time = "0.3"
futures-util = "0.3"
uuid = { version = "1.17.0", features = ["v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
tauri-plugin-dialog = "2"
# 钉住 2.2.0：2.4.x 会把 tauri-runtime-wry 顶到与当前 tauri 2.5.1 不兼容的版本
tauri-plugin-window-state = "=2.2.0"
urlencoding = "2.1.3"
keyring = "4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
