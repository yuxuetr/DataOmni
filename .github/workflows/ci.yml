name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Type-check frontend
        run: bun run typecheck

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build

      - name: Check Rust formatting
        run: bun run rust:fmt

      - name: Run Rust Clippy
        run: bun run rust:clippy

      # 不带 AI 的构建（内网 / 信创）要一直编得过：没人用的那一套会悄悄坏掉。见 rfcs/editions-and-branching.md §5
      - name: Rust clippy (no default features)
        run: bun run rust:clippy:no-ai

      - name: Test Rust
        run: bun run rust:test

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit frontend dependencies
        run: bun run audit:frontend

      - name: Audit Rust dependencies
        run: bun run rust:audit

  database-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 与 runner 自带的 pg_dump（16）同一个大版本：pg_dump 对更新的服务端直接拒绝，
        # 而 runner 上没配 PostgreSQL 的 apt 源，装不上新的客户端
        image: postgres:16
        env:
          POSTGRES_DB: dataomni_test
          POSTGRES_PASSWORD: dataomni
          POSTGRES_USER: dataomni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataomni -d dataomni_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dataomni_test
          MYSQL_PASSWORD: dataomni
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: dataomni
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATAOMNI_REQUIRE_NETWORK_DATABASE_TESTS: "1"
      DATAOMNI_POSTGRES_TEST_URL: postgres://dataomni:dataomni@localhost:5432/dataomni_test
      # root：用例要建函数、触发器（开着 binlog 时普通用户要 SUPER）和恢复备份用的新库
      DATAOMNI_MYSQL_TEST_URL: mysql://root:root@localhost:3306/dataomni_test?ssl-mode=DISABLED

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run database smoke tests
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --test database_smoke -- --nocapture 2>&1 | tee smoke.log
          test "${PIPESTATUS[0]}" -eq 0
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            bash scripts/summarize-smoke-log.sh --header >> "$GITHUB_STEP_SUMMARY"
            bash scripts/summarize-smoke-log.sh "database_smoke (SQLite + PG 16 + MySQL 8.4)" smoke.log >> "$GITHUB_STEP_SUMMARY"
          fi

  # 只在 Windows 上成立的路径用例（`#[cfg(windows)]`）：超过 260 字符的 SQLite / DuckDB 库文件能打开、能备份。
  # 测试二进制没有 longPathAware 清单，所以 runner 上开没开 LongPathsEnabled 都一样要靠 `\\?\`。
  # 只跑这几条：整套用例在 Windows 上没人维护过，全跑会把别的平台差异混进来（TODOs G13）
  windows-paths:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 过滤名写错时 cargo 跑 0 条也算过：数一下真跑了的条数（SQLite 两条改写、SQLite 打开与备份、DuckDB 打开）
      - name: Run Windows path tests
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib -- max_path long_windows --nocapture 2>&1 | tee test.log
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "test result: ok. 4 passed" test.log
