name: Release

# 推 `v*` tag 时三个平台各打一份安装包，传到一个**草稿** Release，看过再手动发布。
# 手动触发（Actions 页面的 Run workflow）只打包、挂在这次运行的 Artifacts 里，不建 Release。
#
# 都没有签名：没有 Apple Developer ID（macOS 首次打开要在「隐私与安全性」里放行），
# Windows 也没有代码签名证书（SmartScreen 会拦一下）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            bundles: app,dmg
          # 22.04 而不是更新的：glibc 跟着构建机走，旧一点的发行版也装得上
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,rpm
          - os: windows-latest
            platform: windows-x64
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Oracle Instant Client download
        uses: actions/cache@v4
        with:
          path: ~/.cache/dataomni/instantclient
          key: instantclient-${{ matrix.platform }}-${{ hashFiles('scripts/fetch-oracle-client.sh') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Fetch Oracle Instant Client
        run: bash scripts/fetch-oracle-client.sh ${{ matrix.platform }}

      # tag 推上来时版本号跟 tag 走（v0.6.0 → 0.6.0），免得包名和 Release 对不上
      - name: Build
        run: |
          version_config=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_config=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          # macOS 要给整个 .app 做 ad-hoc 签名：只有链接器签的主程序时，包的签名校验不过，
          # 下载下来 macOS 说「已损坏」，而且不给「仍要打开」。
          # hardened runtime 要关：它只许加载同一开发者签的库，而 Instant Client 是 Oracle 签的，
          # 开着时 dlopen 直接被拒（本机实测过）。ad-hoc 签名本来也过不了公证，它在这里没有用处
          bun tauri build \
            --bundles ${{ matrix.bundles }} \
            --config src-tauri/tauri.oracle.conf.json \
            --config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}' \
            "${version_config[@]}"

      - name: Verify the macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          app=src-tauri/target/release/bundle/macos/DataOmni.app
          codesign --verify --deep --strict --verbose=2 "$app"
          if codesign -dvv "$app" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "hardened runtime 开着，Instant Client 会加载不了" >&2
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: DataOmni-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          安装包都没有签名。

          - **macOS（Apple Silicon）**：第一次打开会被拦下，到「系统设置 → 隐私与安全性」底部点「仍要打开」；
            或者装好后在终端执行 `xattr -dr com.apple.quarantine /Applications/DataOmni.app`。
          - **Windows**：SmartScreen 提示「Windows 已保护你的电脑」时点「更多信息 → 仍要运行」。
          - **Linux**：`.deb`（Ubuntu / Debian）与 `.rpm`（Fedora / RHEL），x86_64。

          各版本的改动见 README「更新日志」。
          EOF
          gh release create "$GITHUB_REF_NAME" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "DataOmni $GITHUB_REF_NAME" \
            --notes-file notes.md
